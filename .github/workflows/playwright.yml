name: Playwright Tests
on:
  push:
    branches: [master]
    paths:
      - "be/**"
      - "fe/**"
      - "Dockerfile"
      - "compose.yaml"
      - ".github/workflows/playwright.yml"
  pull_request:
    branches: [master]
    paths:
      - "be/**"
      - "fe/**"
      - "Dockerfile"
      - "compose.yaml"
      - ".github/workflows/playwright.yml"
jobs:
  test:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fe/package-lock.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: setup go app
        run: |
          docker compose up -d
      - name: wait for db to be ready
        run: |
          max_retries=10
          retries=0
          healthcheck_url="http://localhost:8091/healthcheck"

          until [ $retries -ge $max_retries ]
          do
            status_code=$(curl -o /dev/null -s -w "%{http_code}" $healthcheck_url)
            if [ $status_code -eq 200 ]; then
              echo "Health check successful (HTTP 200 OK)"
              exit 0
            else
              echo "Health check failed (HTTP $status_code), retrying..."
              retries=$((retries+1))
              sleep 10  # Adjust retry interval as needed
            fi
          done

          echo "Health check failed after $max_retries retries"
          exit 1

      - name: setup node app
        run: |
          cd fe
          npm ci
          npx playwright install --with-deps
          # Mobile Chrome/Mobile Safari projects also exist in
          # playwright.config.ts (local-only for now) - pinned here so
          # enabling them doesn't silently triple this job's test matrix
          # and runtime without a deliberate decision to add them to CI too.
          npx playwright test --project=chromium

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: fe/playwright-report/
          retention-days: 30
